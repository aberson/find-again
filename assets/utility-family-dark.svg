<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,'Roboto Mono',monospace" role="img" aria-label="Seven local-first utilities around one dev session. Opening the session: find-again recovers the context, heads-up claims the work, tripwire preflights the command. Closing the session: changed-check validates the change, same-page reconciles the status, mesh-lens measures the routing. Across sessions: paper-trail records the decision.">
  <defs>
    <marker id="ar-s-dark" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6e9bff"/></marker>
    <filter id="sh-dark" x="-20%" y="-45%" width="140%" height="190%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,.5)"/></filter>
  </defs>
  <style>
    .bg{fill:#161c26;stroke:#29313f;stroke-width:1.5}
    .spine{fill:none;stroke:#6e9bff;stroke-width:2.4}
    .node rect{fill:#161c26;stroke:#384153;stroke-width:1.4;filter:url(#sh-dark)}
    .hub rect{stroke:#6e9bff;stroke-width:2}
    .pn{fill:#6e9bff;font-size:13px;font-weight:600}
    .ps{fill:#7c8598;font-size:10.5px}
    .lbl{fill:#7c8598;font-size:11px;letter-spacing:.12em;font-weight:600}
  </style>
  <rect class="bg" x="6" y="6" width="988" height="318" rx="16"/>
  <text class="lbl" x="24" y="32">OPEN THE SESSION</text>
  <text class="lbl" x="756" y="32">CLOSE THE SESSION</text>
  <text class="lbl" x="500" y="302" text-anchor="middle">ACROSS SESSIONS</text>
  <path class="spine" marker-end="url(#ar-s-dark)" d="M244,71 L390,121"/>
  <path class="spine" marker-end="url(#ar-s-dark)" d="M244,141 L390,141"/>
  <path class="spine" marker-end="url(#ar-s-dark)" d="M244,211 L390,161"/>
  <path class="spine" marker-end="url(#ar-s-dark)" d="M610,121 L756,71"/>
  <path class="spine" marker-end="url(#ar-s-dark)" d="M610,141 L756,141"/>
  <path class="spine" marker-end="url(#ar-s-dark)" d="M610,161 L756,211"/>
  <path class="spine" marker-end="url(#ar-s-dark)" d="M500,173 L500,236"/>
  <g class="node"><rect x="24" y="48" width="220" height="46" rx="10"/><text class="pn" x="38" y="69">find-again</text><text class="ps" x="38" y="86">recover the context</text></g>
  <g class="node"><rect x="24" y="118" width="220" height="46" rx="10"/><text class="pn" x="38" y="139">heads-up</text><text class="ps" x="38" y="156">claim the work</text></g>
  <g class="node"><rect x="24" y="188" width="220" height="46" rx="10"/><text class="pn" x="38" y="209">tripwire</text><text class="ps" x="38" y="226">preflight the command</text></g>
  <g class="node hub"><rect x="390" y="109" width="220" height="64" rx="12"/><text class="pn" x="500" y="132" text-anchor="middle">dev session</text><text class="ps" x="500" y="151" text-anchor="middle">one repo, one window</text></g>
  <g class="node"><rect x="756" y="48" width="220" height="46" rx="10"/><text class="pn" x="770" y="69">changed-check</text><text class="ps" x="770" y="86">validate the change</text></g>
  <g class="node"><rect x="756" y="118" width="220" height="46" rx="10"/><text class="pn" x="770" y="139">same-page</text><text class="ps" x="770" y="156">reconcile the status</text></g>
  <g class="node"><rect x="756" y="188" width="220" height="46" rx="10"/><text class="pn" x="770" y="209">mesh-lens</text><text class="ps" x="770" y="226">measure the routing</text></g>
  <g class="node"><rect x="390" y="236" width="220" height="46" rx="10"/><text class="pn" x="404" y="257">paper-trail</text><text class="ps" x="404" y="274">record the decision</text></g>
</svg>
